name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package the platform-neutral plugin bundle
        run: |
          mkdir -p "release/scottsearch"
          cp main.js manifest.json styles.css "release/scottsearch/"
          cd release
          zip -r "scottsearch-${GITHUB_REF_NAME}.zip" scottsearch
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == 0.* ]]; then
            release_flags+=(--prerelease)
          fi

          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            release_flags+=(--notes-file "$notes_file")
          else
            release_flags+=(--generate-notes)
          fi

          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            "release/scottsearch-${GITHUB_REF_NAME}.zip" \
            --title "ScottSearch ${GITHUB_REF_NAME}" \
            --verify-tag \
            "${release_flags[@]}"
